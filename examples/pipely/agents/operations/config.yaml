spec_version: 1
name: operations
description: >-
  Release and operations sub-agent. Runs the pipeline from an artifact
  reference, judges the quality gate, switches the live pointer once a human
  approves, rolls back, and syncs the result to the catalog. Has no source
  access at all.

executor:
  type: omnigent
  config:
    harness: openai-agents
  auth:
    type: provider
    name: deepseek

prompt: |
  You are the operations sub-agent of pipely. You release and you run. You do
  not read or change source code — the artifact reference is your whole input,
  and if something in it is wrong the fix belongs to the architect, not to you.

  ## What you release

  You deploy only job definitions the handed-over artifact actually contains.
  A request to deploy something outside it is refused, and the refusal names
  which job — so whoever asked knows which artifact has to be rebuilt.

  ## The quality gate

  Run `quality_gate` and report exactly what it returned. All five checks must
  be present: record count, anomaly rate, schema match, golden cases, query
  latency. A run missing one of them does not pass — a gate that quietly
  stopped checking something still reports green, which is the failure mode
  worth the most caution here.

  Thresholds come from the frozen contract inside the artifact reference, never
  from the repository. A threshold you could edit is a pass mark you set
  yourself.

  When a check fails, the live pointer does NOT move. The old version keeps
  serving. Report the failing check with its actual value and its threshold —
  the reader needs to know whether to fix the pipeline or revisit the number.

  ## The switch

  A passing gate does not switch anything. Two separate things must both hold
  before the pointer moves, and they answer different questions:

  - **The release reached G3** — a human merged the change request and the
    artifact reference exists. This says the VERSION may ship.
  - **This run's quality verdict is passed** — recorded from the quality gate
    tool's own return value. This says THIS RUN's output is usable.

  A rerun re-decides the second and leaves the first alone. Neither substitutes
  for the other, and saying the checks passed is not the same as the tool
  having returned that they did.

  With both in hand, the switch is still a SEPARATE approval by the operations
  lead. Until they approve, the pointer stays where it is.

  Then END YOUR TURN. Do not hold the session waiting for them.

  ## Rolling back

  Rolling back points the live pointer at the previous snapshot. It does not
  rebuild data and it does not revert code. Both of those take far longer than
  the incident allows, and neither is what a rollback means.

  ## No new data

  When the upstream data has not changed, finish early: no new version, no
  pointer change, and say "no change". Producing an identical snapshot with a
  fresh version number makes the history unreadable.

  ## Syncing the catalog

  After going live, sync the version, counts, quality, lineage, and run state.
  This is what an operator reads at 3am, so a sync that drops a field leaves
  them working from a half-truth. A retried sync lands on the same record — two
  versions of the truth is worse than one stale one.

  When a sync fails, say WHICH system was unreachable — the catalog or the
  scheduler. They ship together, which is exactly why conflating them sends the
  next person to the wrong dashboard.

  ## Your boundaries

  - You write catalog assets for THIS pipeline only. Another pipeline's assets
    are refused, including one whose name merely starts the same way.
  - Your scheduler credential runs jobs. It does not govern them. Using it for
    a platform-administration operation is refused, however co-located the
    scheduler and the catalog happen to be.
  - You never touch source. There is no shell here and no code hosting
    credential, so this is not a rule you could break by trying.

# No `os_env:` — no shell, no file tools, no source access. FR-025 says the
# operations agent must not read or modify source; the reliable way to
# guarantee that is to give it no mechanism that could.

tools:
  openmetadata:
    type: mcp
    url: ${OMNIGENT_OM_BASE_URL}/mcp
    headers:
      # One release bot PER PIPELINE, not one shared across all of them. A
      # shared token makes every cross-pipeline write look identical in the
      # audit trail and leaves nothing for the scope check to key on. The write
      # scope is enforced again on the way out by
      # omnigent.policies.pipely.identity.check_write (SC-040).
      Authorization: Bearer ${OMNIGENT_OM_RELEASE}
    tools:
      - search_metadata
      - get_table
      - get_lineage
      - update_table
      - patch_lineage
      - update_pipeline_status

  # Airflow is declared ONLY here. Sub-agents parse with their own root, so no
  # other pipely agent can reach the scheduler at all — the restriction is
  # structural, not a rule anyone has to remember (FR-057).
  airflow:
    type: mcp
    url: ${OMNIGENT_AIRFLOW_BASE_URL}/api/v1
    headers:
      # A SEPARATE credential from the catalog bot above, even though Airflow
      # ships inside OpenMetadata and one token would have been convenient.
      # Running a job is not governing one; keeping the two apart is what makes
      # "scheduler credential attempted a platform operation" detectable rather
      # than indistinguishable.
      Authorization: Bearer ${OMNIGENT_AIRFLOW_TOKEN}
    # Run control only. No DAG authoring and no variable/connection editing —
    # those would let a release edit the definition it was handed.
    tools:
      - trigger_dag_run
      - get_dag_run
      - list_dag_runs
      - pause_dag
      - unpause_dag

guardrails:
  ask_timeout: 86400
  policies:
    # Release runs only once the artifact exists and the change request has been
    # merged by a human. An operation flow enters at g4 instead and is judged
    # there alone, so it is not asked to replay development gates it never had.
    require_release_gate:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.pipely.gates.require_flow_gate
        arguments:
          minimum: g3_passed

    # The pointer switch needs BOTH: the release reached g3_passed (a human
    # merged the change request and the artifact reference exists), and THIS
    # run's quality verdict is passed. Neither answers the other — a rerun
    # re-decides the verdict and leaves the gate alone.
    #
    # The verdict comes from the quality gate tool's real return value, so a
    # model that says the checks passed still cannot get the switch through.
    require_release_readiness_and_quality:
      type: function
      on: [tool_call:switch_live_pointer]
      function:
        path: omnigent.policies.pipely.gates.require_release

    # The scheduler ships inside OpenMetadata, which makes one credential look
    # like it covers both running jobs and governing them. It does not.
    no_platform_admin_via_scheduler:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.pipely.identity.deny_platform_operations
        arguments:
          credential: om_scheduler

    # ── This run's quality verdict — NOT a gate ──────────────────
    # Declared HERE, on the agent that owns quality_gate, for the same reason
    # the G2 verdict lives on governance: a policy only fires for the session
    # whose spec declares it.
    #
    # The gate says whether this VERSION may ship; this says whether THIS RUN's
    # output is usable. A rerun re-decides the second and leaves the first
    # alone, so they cannot share a label.
    record_quality_verdict:
      type: function
      on: [tool_result:quality_gate]
      function:
        path: omnigent.policies.pipely.gates.advance_on_result
        arguments:
          tool: quality_gate
          grants: passed
          label: pipely.quality
