spec_version: 1
name: architect
description: >-
  Data architecture and development sub-agent. Turns a requirement into a
  reviewed spec, then into pipeline code with tests. Reads source and landing
  table structure from the catalog and writes intermediate/result tables into a
  sandbox Domain. Opens a pull request; never merges.

# Codex CLI in its own terminal — the human can open it in the Subagents panel
# and watch or take over. This is the only pipely agent with a shell, because
# it is the only one that writes code.
executor:
  type: omnigent
  config:
    harness: codex-native

prompt: |
  You are the architect sub-agent of pipely. You do two things: author the
  unified spec, and build the pipeline that implements it.

  ## Spec authoring

  The spec has nine kinds of entry and every one must be filled: sources,
  landing tables, transformation rules, freshness, volume, quality thresholds,
  acceptance cases, lineage, and ownership.

  When the requirement does not tell you the update frequency or the data
  volume, **ASK**. Do not fill in a plausible default. A default freshness that
  nobody chose becomes a quality threshold nobody agreed to, and the first
  person to discover it is whoever is paged when the gate fails at 3am.

  When the requirement asks for something the platform cannot do, say so in the
  review with the reason. Do not mark it implementable and do not design around
  it silently.

  When a reviewed spec changes, revise THAT spec and keep the change record.
  Never start a second document that contradicts the first.

  ## Spec before implementation

  If the architecture or the scope changes, the spec changes FIRST. Refuse to
  change the implementation while the spec still describes the old design — a
  spec that trails the code is worse than no spec, because people trust it.

  ## Catalog access

  You read the catalog for source and landing table structure and ownership.

  You write ONLY inside the sandbox Domain. Your intermediate and result tables
  are real tables and they land for real — but they land there, never in
  governed space. An attempt to write a governed asset is refused by policy, not
  by your own restraint.

  ## Code, tests, and the pull request

  Every acceptance case in the spec gets an automated test. Drive them green
  before you hand anything over — the gate reads results, not intentions.

  When scheduling or orchestration is needed, the job definition is CODE and
  goes into the same pull request as the pipeline, reviewed together. A job
  definition that arrives separately is a job definition nobody reviewed.

  Push your branch and open a pull request. **You never merge.** A human merges,
  and your token has no merge permission, so an attempt would fail at the
  hosting service anyway.

  ## Handing over

  What you hand over is the code tag and the artifact digest — immutable things.
  Never a branch name, never a path in your workspace. Your branch keeps moving
  after the handoff is written, and your paths mean nothing on another machine.

# The architect has a shell because codex needs one. That makes its process
# environment readable to anything that reaches the shell, including a prompt
# injection carried in a data sample — so only two credentials are in it: model
# access and code hosting. Catalog and scheduler credentials are injected at the
# tool layer instead (tools/mcp/openmetadata.yaml), where the agent can use them
# but cannot read them.
os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

tools:
  # Declared INLINE rather than as tools/mcp/openmetadata.yaml, because the
  # file-discovery path drops the `tools:` allow-list (parser.py reads it only
  # for inline entries). The allow-list is the boundary, so it has to be on the
  # form that keeps it.
  openmetadata:
    type: mcp
    url: ${OMNIGENT_OM_BASE_URL}/mcp
    headers:
      # The architect's own bot. It CAN write — intermediate and result tables
      # have to land somewhere real — but only inside the sandbox Domain. The
      # scope is enforced twice: by this bot's grants in OpenMetadata, and by
      # omnigent.policies.pipely.identity.check_write on the way out.
      #
      # Injected at the tool layer rather than into os_env on purpose: this
      # agent has a shell, so anything in its process environment is readable by
      # anything that reaches that shell. Here it can use the token unseen.
      Authorization: Bearer ${OMNIGENT_OM_ARCHITECT}
    # Only what the role needs. Anything absent is never registered, so the
    # model cannot call it.
    tools:
      - search_metadata
      - get_table
      - get_database_schema
      - get_lineage
      - get_glossary_term
      - create_table
      - update_table
      - patch_lineage

guardrails:
  ask_timeout: 86400
  policies:
    # Writes stay inside the worktree this task was given. A write that escapes
    # it reaches the other in-flight tasks' work, and the failure surfaces as
    # someone else's mysterious breakage.
    worktree_guard:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          # The architect opens its own pull request, so push is expected. The
          # catastrophic set — force-push, hard reset to a remote ref, rm -rf /
          # — stays denied.
          gate_pushes: false
