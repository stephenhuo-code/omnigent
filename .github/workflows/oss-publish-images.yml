# Builds + pushes two images to GHCR via GITHUB_TOKEN: the server image
# (ghcr.io/<owner>/omnigent-server, referenced by every deploy template) and
# the host image (the `host` target of the same Dockerfile,
# ghcr.io/<owner>/omnigent-host — default for `sandbox create --provider
# modal` and server-launched managed hosts). The namespace is derived from
# the repository owner. Dockerfile ARGs default to public registries, so no
# build-args needed.
#
# When ACR_REGISTRY / ACR_NAMESPACE are set, the server and host images are
# ALSO pushed to that Aliyun registry in the same build — buildx writes every
# tag from one build, so mirroring costs no extra time. The deploy box pulls
# from there over the VPC; ghcr from mainland China is too slow to hang an
# unattended deploy on.
#
# Tag scheme:
#   :sha-<short>    immutable per-commit pin, published on EVERY qualifying build.
#   :vX.Y.Z[rcN]    immutable version pin, published for every release + pre-release tag.
#   :latest         the highest FINAL release (max over vX.Y.Z) — tracks what
#                   `pip install omniagentkit` resolves to. Pre-releases never move it.
#   :main           HEAD of main (dev channel); server + host, amd64 only.
#   :latest-rc      the highest version OVERALL, max(release, rc) — the newest
#                   thing tagged, pre-release or not.
# Ordering for :latest / :latest-rc uses PEP 440 (1.2.3rc1 < 1.2.3), which
# `sort -V` gets wrong, so the max is computed with .github/scripts/
# oss-publish-images/maxver.py (Python `packaging`).
#
# First run creates the GHCR packages PRIVATE; flip them to public once in the
# org package settings to allow unauthenticated pulls (cannot be done in CI).
name: Publish images (public)

on:
  # Two channels. A v* tag is the release channel: every image, both
  # architectures, immutable version pin plus the floating release tags.
  # A main push is the dev channel: server + host only, amd64 only, tagged
  # :main + :sha-<short> — enough to redeploy the ECS box from HEAD without
  # paying for four multi-arch builds on every commit. PRs get a build-only
  # check (docker-build.yml) so a broken image is caught before merge.
  push:
    branches: ['main']
    tags: ['v*']
  # No nightly rebuild: it existed upstream to cover main pushes not building,
  # and they build here. Rerunning it would rebuild identical code. Dispatch
  # manually when a base-image patch is worth picking up.
  workflow_dispatch:
    inputs:
      bump_latest:
        description: 'Also move :latest to this build (manual release of latest). Off by default.'
        type: boolean
        default: false
      reconcile_floating:
        description: 'Repoint :latest and :latest-rc onto the correct existing version images (no rebuild). Runs only the reconcile job. Off by default.'
        type: boolean
        default: false

# Read-only at the top level; write scopes live on the jobs below.
permissions:
  contents: read

concurrency:
  # One build at a time: rc and final tags land minutes apart at a release cut,
  # and built concurrently they race each other's layer cache cold and blow the
  # job timeout. Serialized, the later build reuses the earlier one's layers.
  group: oss-publish-images
  cancel-in-progress: false

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write # push the image to GHCR via GITHUB_TOKEN
    # Gated to this repository; inert in forks and mirrors. Runs on main
    # pushes, tag pushes, and bump_latest dispatches. Skipped on
    # reconcile_floating dispatches — that only drives the
    # reconcile-floating retag job.
    if: github.repository == 'stephenhuo-code/omnigent' && !inputs.reconcile_floating
    runs-on: ubuntu-latest
    # Multi-arch: the linux/arm64 leg cross-builds under QEMU emulation on this
    # amd64 runner, which roughly doubles the host-image build time (emulated
    # npm/pip native steps). A cold-cache four-variant (server+host × amd64+
    # arm64) build can exceed 60m, and hitting the timeout loses the release's
    # images silently — give it real headroom.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Register binfmt handlers so Buildx can cross-build the linux/arm64
      # variant on this amd64 runner (emulated). Without it the arm64 leg of
      # the multi-arch builds below fails with "exec format error".
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      # Needed only for the PEP 440 max() on tag pushes; cheap on other events.
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: false

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional second registry. Pulling ghcr from a mainland-China ECS box is
      # slow enough to make unattended deploys unreliable; an Aliyun ACR copy in
      # the deploy region is pulled over the VPC instead. Skipped entirely when
      # the vars are unset, so a fork without ACR still publishes to ghcr.
      - name: Log in to Aliyun ACR
        if: vars.ACR_REGISTRY != '' && vars.ACR_NAMESPACE != ''
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Compute the tag set for this event. ref / ref_name go through env (not
      # inline ${{ }}) so a crafted tag name can't inject shell.
      - name: Compute image tags
        id: tags
        env:
          GH_REF: ${{ github.ref }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP_LATEST: ${{ inputs.bump_latest }}
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
        run: |
          set -euo pipefail
          # Namespace follows the repo owner (ghcr requires it lowercase, which
          # the owner already is) so a fork needs no edit here to publish.
          OWNER="${GH_REPO%%/*}"
          IMAGE="ghcr.io/${OWNER}/omnigent-server"
          HOST_IMAGE="ghcr.io/${OWNER}/omnigent-host"
          OPENSHELL_IMAGE="ghcr.io/${OWNER}/omnigent-server-openshell"
          KUBERNETES_IMAGE="ghcr.io/${OWNER}/omnigent-server-kubernetes"
          SHORT_SHA=$(git rev-parse --short HEAD)

          # Mirror only what a deploy pulls — server and host. The openshell and
          # kubernetes variants stay on ghcr alone; nothing here deploys them,
          # and ACR's personal tier has a repository quota worth conserving.
          ACR_IMAGE=""
          ACR_HOST_IMAGE=""
          if [ -n "${ACR_REGISTRY:-}" ] && [ -n "${ACR_NAMESPACE:-}" ]; then
            ACR_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/omnigent-server"
            ACR_HOST_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/omnigent-host"
          fi

          # Immutable per-commit pin, always.
          TAGS="${IMAGE}:sha-${SHORT_SHA}"
          HOST_TAGS="${HOST_IMAGE}:sha-${SHORT_SHA}"
          OPENSHELL_TAGS="${OPENSHELL_IMAGE}:sha-${SHORT_SHA}"
          KUBERNETES_TAGS="${KUBERNETES_IMAGE}:sha-${SHORT_SHA}"
          if [ -n "${ACR_IMAGE}" ]; then
            TAGS="${TAGS},${ACR_IMAGE}:sha-${SHORT_SHA}"
            HOST_TAGS="${HOST_TAGS},${ACR_HOST_IMAGE}:sha-${SHORT_SHA}"
          fi

          # Append a floating/version tag to all images.
          add_tag() {
            TAGS="${TAGS},${IMAGE}:$1"
            HOST_TAGS="${HOST_TAGS},${HOST_IMAGE}:$1"
            OPENSHELL_TAGS="${OPENSHELL_TAGS},${OPENSHELL_IMAGE}:$1"
            KUBERNETES_TAGS="${KUBERNETES_TAGS},${KUBERNETES_IMAGE}:$1"
            if [ -n "${ACR_IMAGE}" ]; then
              TAGS="${TAGS},${ACR_IMAGE}:$1"
              HOST_TAGS="${HOST_TAGS},${ACR_HOST_IMAGE}:$1"
            fi
          }

          # Dev channel: a push to main. Moves :main so a deploy can track
          # HEAD. IS_DEV narrows the build matrix below.
          IS_DEV=false
          if [ "${GH_REF}" = "refs/heads/main" ]; then
            IS_DEV=true
            add_tag "main"
          fi

          if [[ "${GH_REF}" == refs/tags/v* ]]; then
            # Immutable version pin for every release AND pre-release.
            add_tag "${GH_REF_NAME}"

            # Decide which floating release tags this version owns, using PEP 440
            # ordering over the full tag list. :latest-rc => max(release, rc);
            # :latest => max(final release).
            ALL_TAGS=$(gh api "repos/${GH_REPO}/tags" --paginate --jq '.[].name')
            decision=$(CUR="${GH_REF_NAME}" ALL_TAGS="${ALL_TAGS}" \
              uv run --with packaging --no-project python .github/scripts/oss-publish-images/maxver.py)
            IS_MAX_RC="${decision% *}"
            IS_MAX_RELEASE="${decision#* }"
            echo "version=${GH_REF_NAME} is_max_rc=${IS_MAX_RC} is_max_release=${IS_MAX_RELEASE}"

            # :latest-rc tracks max(release, rc).
            if [ "${IS_MAX_RC}" = "true" ]; then
              add_tag "latest-rc"
            fi
            # :latest tracks the highest FINAL release only.
            if [ "${IS_MAX_RELEASE}" = "true" ]; then
              add_tag "latest"
            fi
          fi

          # A manual dispatch can still force-move :latest (human approval).
          if [ "${BUMP_LATEST}" = "true" ]; then
            add_tag "latest"
          fi

          # Dev builds target the x86 ECS box only; the release channel keeps
          # publishing manifest lists so arm64 consumers are unaffected.
          if [ "${IS_DEV}" = "true" ]; then
            PLATFORMS="linux/amd64"
          else
            PLATFORMS="linux/amd64,linux/arm64"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "host_tags=${HOST_TAGS}" >> "$GITHUB_OUTPUT"
          echo "openshell_tags=${OPENSHELL_TAGS}" >> "$GITHUB_OUTPUT"
          echo "kubernetes_tags=${KUBERNETES_TAGS}" >> "$GITHUB_OUTPUT"
          echo "is_dev=${IS_DEV}" >> "$GITHUB_OUTPUT"
          echo "platforms=${PLATFORMS}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "host_image=${HOST_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "openshell_image=${OPENSHELL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "kubernetes_image=${KUBERNETES_IMAGE}" >> "$GITHUB_OUTPUT"

      # No build-args: the Dockerfile ARGs default to public registries.
      # Multi-arch: each tag publishes as a manifest list spanning amd64 + arm64,
      # so the image runs natively on Apple Silicon / arm64 clusters. Amd64-only
      # consumers (Modal, Daytona, CoreWeave) keep pulling the amd64 variant —
      # the list is a superset, so nothing changes for them.
      - name: Build and push
        id: build-server
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          platforms: ${{ steps.tags.outputs.platforms }}
          tags: ${{ steps.tags.outputs.tags }}
          # boto3, for the S3 artifact store. The deploy keeps artifacts in
          # Aliyun OSS over its S3-compatible API, and the store raises on a
          # missing boto3 at startup — a container cannot install it later.
          build-args: |
            OMNIGENT_EXTRAS=s3
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: true

      # Host image: same Dockerfile, `host` target, also multi-arch (amd64 +
      # arm64). The harness CLIs it bakes in all ship arm64 — claude-code and
      # codex publish linux-arm64 npm binaries, pi is pure-JS. Runs after the
      # server build so it reuses the shared builder-stage layers from the gha
      # cache (cached per platform).
      - name: Build and push host image
        id: build-host
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: host
          push: true
          platforms: ${{ steps.tags.outputs.platforms }}
          tags: ${{ steps.tags.outputs.host_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: true

      # OpenShell server variant: the default server image plus the
      # openshell SDK extra (OMNIGENT_EXTRAS=openshell). Used by the
      # deploy/kubernetes/overlays/openshell kustomize overlay. Reuses
      # the shared builder-stage layers from the gha cache.
      - name: Build and push openshell server image
        id: build-openshell
        # Release channel only — nothing here deploys the openshell variant.
        if: steps.tags.outputs.is_dev != 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          platforms: ${{ steps.tags.outputs.platforms }}
          tags: ${{ steps.tags.outputs.openshell_tags }}
          build-args: |
            OMNIGENT_EXTRAS=openshell
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: true

      # Kubernetes server variant: the default server image plus the kubernetes
      # client extra (OMNIGENT_EXTRAS=kubernetes), so `sandbox.provider:
      # kubernetes` works without a self-built image. Used by the
      # deploy/kubernetes/overlays/sandbox-runners kustomize overlay. Reuses
      # the shared builder-stage layers from the gha cache.
      - name: Build and push kubernetes server image
        id: build-kubernetes
        # Release channel only — nothing here deploys the kubernetes variant.
        if: steps.tags.outputs.is_dev != 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          platforms: ${{ steps.tags.outputs.platforms }}
          tags: ${{ steps.tags.outputs.kubernetes_tags }}
          build-args: |
            OMNIGENT_EXTRAS=kubernetes
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: true
    outputs:
      server-digest: ${{ steps.build-server.outputs.digest }}
      host-digest: ${{ steps.build-host.outputs.digest }}
      openshell-digest: ${{ steps.build-openshell.outputs.digest }}
      kubernetes-digest: ${{ steps.build-kubernetes.outputs.digest }}
      is-dev: ${{ steps.tags.outputs.is_dev }}
      server-image: ${{ steps.tags.outputs.image }}
      host-image: ${{ steps.tags.outputs.host_image }}
      openshell-image: ${{ steps.tags.outputs.openshell_image }}
      kubernetes-image: ${{ steps.tags.outputs.kubernetes_image }}

  generate-sbom:
    # Runs in a separate job with read-only permissions so the Syft
    # install script cannot influence the image push. Scans the
    # already-pushed images by digest (immutable). Release channel only:
    # the dev channel skips the openshell / kubernetes variants, so half
    # the digests below would be empty.
    needs: build-and-push
    if: needs.build-and-push.outputs.is-dev != 'true'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Log in to GHCR (read-only)
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0

      - name: Generate server SBOM
        run: |
          set -euo pipefail
          syft "${{ needs.build-and-push.outputs.server-image }}@${{ needs.build-and-push.outputs.server-digest }}" \
            -o cyclonedx-json=server-sbom.cdx.json \
            -o spdx-json=server-sbom.spdx.json

      - name: Generate host SBOM
        run: |
          set -euo pipefail
          syft "${{ needs.build-and-push.outputs.host-image }}@${{ needs.build-and-push.outputs.host-digest }}" \
            -o cyclonedx-json=host-sbom.cdx.json \
            -o spdx-json=host-sbom.spdx.json

      - name: Generate openshell server SBOM
        run: |
          set -euo pipefail
          syft "${{ needs.build-and-push.outputs.openshell-image }}@${{ needs.build-and-push.outputs.openshell-digest }}" \
            -o cyclonedx-json=openshell-sbom.cdx.json \
            -o spdx-json=openshell-sbom.spdx.json

      - name: Generate kubernetes server SBOM
        run: |
          set -euo pipefail
          syft "${{ needs.build-and-push.outputs.kubernetes-image }}@${{ needs.build-and-push.outputs.kubernetes-digest }}" \
            -o cyclonedx-json=kubernetes-sbom.cdx.json \
            -o spdx-json=kubernetes-sbom.spdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: |
            server-sbom.cdx.json
            server-sbom.spdx.json
            host-sbom.cdx.json
            host-sbom.spdx.json
            openshell-sbom.cdx.json
            openshell-sbom.spdx.json
            kubernetes-sbom.cdx.json
            kubernetes-sbom.spdx.json
          retention-days: 90

  reconcile-floating:
    # Manual reconcile (workflow_dispatch with reconcile_floating=true): repoint
    # :latest and :latest-rc onto the correct EXISTING version images, computed
    # from the tag list with PEP 440 ordering. Retags with `crane tag`
    # (digest-preserving). Idempotent — also a "fix the floating tags if they drift"
    # button, and the way to backfill them for releases cut before this scheme.
    if: github.repository == 'stephenhuo-code/omnigent' && inputs.reconcile_floating
    permissions:
      contents: read
      packages: write # retag within GHCR via GITHUB_TOKEN
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up crane
        uses: imjasonh/setup-crane@59c71e96a00b28651f10369ba3359a6d730740a0  # v0.6
        with:
          version: v0.21.6

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: false

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconcile :latest and :latest-rc
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ALL_TAGS=$(gh api "repos/${GH_REPO}/tags" --paginate --jq '.[].name')
          read -r RC_TAG LATEST_TAG < <(ALL_TAGS="${ALL_TAGS}" \
            uv run --with packaging --no-project python .github/scripts/oss-publish-images/reconcile_targets.py)
          echo "targets: latest-rc<-${RC_TAG}  latest<-${LATEST_TAG}"

          # crane tag repoints a tag onto an EXISTING manifest digest without
          # re-serializing it (unlike `imagetools create`, which wraps a
          # single-platform image in a fresh manifest list and changes the
          # digest). dst=floating tag, src=version tag.
          retag() {
            local img="$1" dst="$2" src="$3"
            if [ "${src}" = "-" ]; then
              echo "::warning::no source for ${img}:${dst}; skipping"
              return
            fi
            if crane digest "${img}:${src}" >/dev/null 2>&1; then
              crane tag "${img}:${src}" "${dst}"
              echo "set ${img}:${dst} -> ${src} ($(crane digest "${img}:${dst}"))"
            else
              echo "::warning::${img}:${src} image not found; skipping ${img}:${dst}"
            fi
          }

          OWNER="${GH_REPO%%/*}"
          for img in "ghcr.io/${OWNER}/omnigent-server" "ghcr.io/${OWNER}/omnigent-host" "ghcr.io/${OWNER}/omnigent-server-openshell" "ghcr.io/${OWNER}/omnigent-server-kubernetes"; do
            retag "${img}" "latest-rc" "${RC_TAG}"
            retag "${img}" "latest" "${LATEST_TAG}"
          done
