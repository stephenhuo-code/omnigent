[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omniagentkit-ui-sdk"
version = "0.9.0.dev0"
description = "Terminal UI components (Rich + prompt_toolkit) for building omnigent frontends"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Version-locked (==) with the sibling client SDK; released together
    # at one version (release-omnigent.yml verifies the pin). A `>=`
    # floor would also reject pre-releases (e.g. 0.1.0rc1 < 0.1.0 in
    # PEP 440).
    "omniagentkit-client==0.9.0.dev0",
    "rich>=13",
    "prompt_toolkit>=3",
    "pyyaml>=6.0,<7",
]

# The import package keeps its original name, so hatchling can no longer
# infer the directory from the distribution name — declare it explicitly.
[tool.hatch.build.targets.wheel]
packages = ["omnigent_ui_sdk"]
