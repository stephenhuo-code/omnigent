[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omniagent-client"
version = "0.9.0.dev0"
description = "Python client SDK for the omnigent server API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Sibling package — provides the SessionStreamEventType /
    # StreamEvent source of truth that the SDK validates SSE
    # envelopes against (see _sessions.py, _sse.py). Resolved via
    # the relative path below so the SDK can be installed
    # editable alongside the root ``omniagent`` package. Version-locked
    # (==) so a published SDK always pairs with the server release it
    # shipped with (release-omnigent.yml verifies the pin).
    "omniagent==0.9.0.dev0",
    "httpx>=0.27",
    "pydantic>=2.0,<3",
]

[tool.uv.sources]
omniagent = { path = "../..", editable = true }

# The import package keeps its original name, so hatchling can no longer
# infer the directory from the distribution name — declare it explicitly.
[tool.hatch.build.targets.wheel]
packages = ["omnigent_client"]
